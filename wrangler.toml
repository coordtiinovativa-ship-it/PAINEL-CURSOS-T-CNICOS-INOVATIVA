name = "certificados-iect-dev"
main = "src/index.tsx"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Arquivos estáticos (logo e fundo padrão do modelo aprovado)
[assets]
directory = "./public"
binding = "ASSETS"

# ---------- ambiente dev (padrão: `wrangler dev`) ----------
[vars]
AMBIENTE = "dev"
URL_PUBLICA = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "certificados-iect-dev"
# Substituir pelo id real após `wrangler d1 create certificados-iect-dev`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "certificados-iect-dev"

# Limites por IP (Rate Limiting do Workers; período: 10 ou 60 s)
# Validação pública /v: 20 consultas/min — freia varredura de códigos INV sequenciais.
[[ratelimits]]
name = "LIMITE_VALIDACAO"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# POST /login: 10 tentativas/min por IP (soma-se ao bloqueio de 15 min por conta após 5 erros).
[[ratelimits]]
name = "LIMITE_LOGIN"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# ---------- produção ----------
[env.production]
name = "certificados-iect"
# Domínio próprio na zona institutoinovativa.org (já na Cloudflare): o deploy cria DNS e certificado HTTPS.
routes = [{ pattern = "certificadostecnicos.institutoinovativa.org", zone_name = "institutoinovativa.org", custom_domain = true }]
# Só o domínio oficial: sem endereço *.workers.dev nem URLs de prévia (evita QR/cookies em outro endereço)
workers_dev = false
preview_urls = false

# Logs de produção (erros e requisições) no painel da Cloudflare
[env.production.observability]
enabled = true

[env.production.vars]
AMBIENTE = "production"
URL_PUBLICA = "https://certificadostecnicos.institutoinovativa.org"

[[env.production.d1_databases]]
binding = "DB"
database_name = "certificados-iect"
database_id = "0f1526e7-f6d7-4798-8a4b-7d09f20445d3"  # criado em 16/11/2026 (região ENAM)
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "certificados-iect"

[[env.production.ratelimits]]
name = "LIMITE_VALIDACAO"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "LIMITE_LOGIN"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
